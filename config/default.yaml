# Qwen VL 系列模型微调默认配置
# 此文件中的参数作为默认值；命令行中若显式传入同名参数，命令行优先

# ========== 模型参数 ==========
tune_mm_vision: false         # 是否训练视觉编码器 (ViT)
tune_mm_mlp: true             # 是否训练 MLP Projector (merger)
tune_mm_llm: true             # 是否训练语言模型主干

# ========== 数据参数 ==========
data_flatten: true            # 数据展平（需要 flash_attn）
max_pixels: 50176             # 图像最大像素数 (224*224)
min_pixels: 784               # 图像最小像素数 (28*28)

# ========== 训练参数 ==========
bf16: true                    # 使用 BFloat16 混合精度训练
lora_enable: true             # ⭐ 启用 LoRA 微调 ⭐
lora_r: 64                    # LoRA 秩
lora_alpha: 128               # LoRA 缩放系数
lora_dropout: 0.05            # LoRA Dropout

num_train_epochs: 1                 # 训练轮数
per_device_train_batch_size: 4      # 每卡 batch size
gradient_accumulation_steps: 4      # 梯度累积步数

eval_strategy: "no"           # 不做 eval
save_strategy: "steps"        # 按步数保存 checkpoint
save_steps: 1000              # 每 N 步保存一次
save_total_limit: 1           # 最多保留几个 checkpoint

learning_rate: 1.0e-5         # 学习率
weight_decay: 0.0             # 权重衰减
warmup_ratio: 0.03            # 学习率预热比例
max_grad_norm: 1.0            # 梯度裁剪阈值
lr_scheduler_type: "cosine"   # 学习率调度器类型

logging_steps: 1                    # 日志打印间隔（步）
model_max_length: 8192              # 最大 token 长度
gradient_checkpointing: true        # 梯度检查点（用时间换显存）
dataloader_num_workers: 4           # DataLoader 子进程数
report_to: "none"                   # 不上报到 wandb / tensorboard
ddp_find_unused_parameters: false   # LoRA+DDP+gradient_checkpointing 必须设为 false，否则反向传播报错
